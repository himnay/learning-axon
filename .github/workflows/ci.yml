name: CI
on:
  push:
    branches: [ axon5-migration, main ]
  pull_request:
    branches: [ axon5-migration, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify -DskipTests=false
